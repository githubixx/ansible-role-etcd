dependency:
  name: galaxy

driver:
  name: vagrant
  provider:
    name: libvirt
    type: libvirt

platforms:
  - name: test-etcd-assets
    box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    groups:
      - etcd_assets
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.11.5
  - name: test-etcd1-ubuntu2204
    box: githubixx/ubuntu-22.04
    memory: 2048
    cpus: 2
    groups:
      - k8s_controller
      - k8s_worker
      - k8s_etcd
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.11.10
  - name: test-etcd2-ubuntu2404
    box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    groups:
      - k8s_controller
      - k8s_worker
      - k8s_etcd
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.11.20
  - name: test-etcd3-ubuntu2604
    box: githubixx/ubuntu-26.04
    memory: 2048
    cpus: 2
    groups:
      - k8s_controller
      - k8s_worker
      - k8s_etcd
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 172.16.11.30

provisioner:
  name: ansible
  connection_options:
    ansible_ssh_user: vagrant
    ansible_become: true
  log: true
  lint: yamllint . && flake8 && ansible-lint

scenario:
  name: default
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
  enabled: true
