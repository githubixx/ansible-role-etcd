- name: Verify setup
  hosts: k8s_etcd
  strategy: linear
  vars:
    verify_etcd_version: "{{ etcd_version | default('3.5.35') }}"
    verify_etcd_conf_dir: "{{ etcd_conf_dir | default('/etc/etcd') }}"
    verify_etcd_client_port: "{{ etcd_client_port | default('2379') }}"
    verify_etcd_peer_port: "{{ etcd_peer_port | default('2380') }}"
    verify_etcd_service: "{{ etcd_service_name | default('etcd') }}.service"
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert etcd service is running
      ansible.builtin.assert:
        that:
          - verify_etcd_service in ansible_facts.services
          - ansible_facts.services[verify_etcd_service].state == 'running'
        fail_msg: "The {{ verify_etcd_service }} service is not running on {{ inventory_hostname }}."

    - name: Check client and peer listeners
      ansible.builtin.wait_for:
        host: "{{ ansible_facts[etcd_interface]['ipv4']['address'] }}"
        port: "{{ item }}"
        timeout: 15
      loop:
        - "{{ verify_etcd_client_port }}"
        - "{{ verify_etcd_peer_port }}"

    - name: Get etcdctl version
      ansible.builtin.command:
        argv:
          - etcdctl
          - version
      register: etcdctl_version_output
      changed_when: false

    - name: Assert etcdctl version
      ansible.builtin.assert:
        that:
          - "'etcdctl version: ' ~ verify_etcd_version in etcdctl_version_output.stdout_lines"
        fail_msg: "Unexpected etcdctl version on {{ inventory_hostname }}: {{ etcdctl_version_output.stdout }}"

    - name: Check local etcd endpoint health
      ansible.builtin.command:
        argv:
          - etcdctl
          - "--endpoints=https://localhost:{{ verify_etcd_client_port }}"
          - "--cacert={{ verify_etcd_conf_dir }}/ca-etcd.pem"
          - "--cert={{ verify_etcd_conf_dir }}/cert-etcd-server.pem"
          - "--key={{ verify_etcd_conf_dir }}/cert-etcd-server-key.pem"
          - endpoint
          - health
      environment:
        ETCDCTL_API: "3"
      register: etcdctl_endpoint_health_output
      changed_when: false

    - name: Assert local etcd endpoint health
      ansible.builtin.assert:
        that:
          - "'is healthy' in etcdctl_endpoint_health_output.stdout"
        fail_msg: "etcd endpoint is unhealthy on {{ inventory_hostname }}: {{ etcdctl_endpoint_health_output.stdout }}"

    - name: Get etcd cluster membership
      ansible.builtin.command:
        argv:
          - etcdctl
          - "--endpoints=https://localhost:{{ verify_etcd_client_port }}"
          - "--cacert={{ verify_etcd_conf_dir }}/ca-etcd.pem"
          - "--cert={{ verify_etcd_conf_dir }}/cert-etcd-server.pem"
          - "--key={{ verify_etcd_conf_dir }}/cert-etcd-server-key.pem"
          - --write-out=json
          - member
          - list
      environment:
        ETCDCTL_API: "3"
      register: etcdctl_members
      changed_when: false
      run_once: true  # noqa: run-once[task]

    - name: Assert all cluster members have joined
      ansible.builtin.assert:
        that:
          - (etcdctl_members.stdout | from_json).members | length == groups['k8s_etcd'] | length
          - (etcdctl_members.stdout | from_json).members | selectattr('name', 'defined') | selectattr('name') | list | length == groups['k8s_etcd'] | length
        fail_msg: "Unexpected etcd cluster membership: {{ etcdctl_members.stdout }}"
      run_once: true  # noqa: run-once[task]
